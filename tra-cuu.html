<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ Liên Lạc Điện Tử</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2b5876;
      --secondary-color: #4e4376;
    }
    body {
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
    }
    .main-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      background: #ffffff;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .header-banner {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 25px 20px;
      text-align: center;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 0.5px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-label { color: #6c757d; font-size: 0.9rem; }
    .info-value { font-weight: 600; color: #212529; }
    
    .table-custom {
      border-collapse: separate;
      border-spacing: 0;
    }
    .table-custom th {
      background-color: #f8f9fa;
      color: #495057;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 2px solid #dee2e6;
    }
    .table-custom td { font-size: 0.92rem; vertical-align: middle; }
    
    /* Trạng thái điểm danh */
    .status-badge {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-block;
    }
    .bg-comat { background-color: #e3f2fd; color: #0d6efd; }   /* Có mặt */
    .bg-cophep { background-color: #d1e7dd; color: #0f5132; }  /* Có phép (Xanh lá) */
    .bg-muon { background-color: #fff3cd; color: #664d03; }    /* Đi muộn */
    .bg-vang { background-color: #f8d7da; color: #842029; }    /* Vắng */
  </style>
</head>
<body>

<div class="container py-4" style="max-width: 650px;">

  <!-- Khối Loading -->
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" style="width: 2.5rem; height: 2.5rem;" role="status"></div>
    <p class="mt-3 text-muted fw-bold">Đang tải thông tin học sinh...</p>
  </div>

  <!-- Khối Báo Lỗi -->
  <div id="errorMessage" class="alert alert-danger d-none text-center my-4 border-0 shadow-sm" style="border-radius: 12px;"></div>

  <!-- Kết Quả Hiển Thị -->
  <div id="resultContainer" class="d-none">
    
    <!-- Banner Tiêu Đề -->
    <div class="main-card">
      <div class="header-banner">
        <h4 class="mb-1 font-weight-bold">SỔ LIÊN LẠC ĐIỆN TỬ</h4>
        <small class="opacity-75">Giáo Xứ / Thiếu Nhi Thánh Thể</small>
      </div>
    </div>

    <!-- Thông Tin Học Sinh -->
    <div class="main-card p-4">
      <div class="section-title border-bottom pb-2">
        <i class="fa-solid fa-user-graduate"></i> THÔNG TIN HỌC SINH
      </div>
      <div class="row g-3 mt-1">
        <div class="col-6">
          <div class="info-label">Họ và Tên</div>
          <div class="info-value" id="txtHoTen">-</div>
        </div>
        <div class="col-6">
          <div class="info-label">Mã Học Sinh</div>
          <div class="info-value text-primary" id="txtMaHS">-</div>
        </div>
        <div class="col-6">
          <div class="info-label">Ngày sinh</div>
          <div class="info-value" id="txtNgaySinh">-</div>
        </div>
        <div class="col-6">
          <div class="info-label">Lớp Giáo Lý</div>
          <div class="info-value" id="txtLop">-</div>
        </div>
        <div class="col-12">
          <div class="info-label">Phụ huynh</div>
          <div class="info-value" id="txtPhuHuynh">-</div>
        </div>
        <div class="col-12">
          <div class="info-label">Địa chỉ</div>
          <div class="info-value" id="txtDiaChi">-</div>
        </div>
      </div>
    </div>

    <!-- Bảng Điểm -->
    <div class="main-card p-4">
      <div class="section-title border-bottom pb-2">
        <i class="fa-solid fa-award"></i> KẾT QUẢ HỌC TẬP
      </div>
      <div class="table-responsive mt-3">
        <table class="table table-custom align-middle text-center mb-0">
          <thead>
            <tr>
              <th class="text-start ps-3">Môn học / Cột điểm</th>
              <th>Điểm số</th>
            </tr>
          </thead>
          <tbody id="tblBangDiem"></tbody>
        </table>
      </div>
    </div>

    <!-- Lịch Sử Điểm Danh -->
    <div class="main-card p-4">
      <div class="section-title border-bottom pb-2">
        <i class="fa-solid fa-calendar-check"></i> ĐIỂM DANH ĐI LỄ & ĐI HỌC
      </div>
      <div class="table-responsive mt-3">
        <table class="table table-custom table-hover align-middle text-center mb-0">
          <thead>
            <tr>
              <th>Ngày</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody id="tblDiemDanh"></tbody>
        </table>
      </div>
    </div>

    <!-- Giáo Lý Viên -->
    <div class="main-card p-4">
      <div class="section-title border-bottom pb-2">
        <i class="fa-solid fa-chalkboard-user"></i> GIÁO LÝ VIÊN PHỤ TRÁCH
      </div>
      <ul class="list-group list-group-flush mt-2" id="listGiaoLyVien"></ul>
    </div>

  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwQAMz4NP80kRnS23GXcHayjPgtvo1UKbtFeIzxh_X8JzkJ33LrrsQXSrttGe1JabYiiQ/exec";

  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const maHS = urlParams.get('ma') || urlParams.get('maHS') || urlParams.get('id');

    if (!maHS) {
      showError("Không tìm thấy Mã học sinh từ đường link QR!");
      return;
    }

    const timeout = setTimeout(() => {
      showError("Thời gian kết nối quá lâu. Vui lòng kiểm tra lại đường truyền mạng.");
    }, 12000);

    // Tải dữ liệu JSONP
    const script = document.createElement('script');
    script.src = `${WEB_APP_URL}?action=get_student_info&maHS=${encodeURIComponent(maHS)}&callback=handleResponse`;
    
    script.onload = () => clearTimeout(timeout);
    script.onerror = () => {
      clearTimeout(timeout);
      showError("Lỗi kết nối tới Server Google Sheets!");
    };

    document.body.appendChild(script);
  });

  function showError(msg) {
    document.getElementById("loading").classList.add("d-none");
    const errBox = document.getElementById("errorMessage");
    errBox.innerText = msg;
    errBox.classList.remove("d-none");
  }

  function handleResponse(data) {
    document.getElementById("loading").classList.add("d-none");

    if (!data || data.status !== "success") {
      showError(data ? data.message : "Không tìm thấy dữ liệu học sinh!");
      return;
    }

    // 1. Thông tin học sinh
    const st = data.student || {};
    document.getElementById("txtHoTen").innerText = st.name || "N/A";
    document.getElementById("txtMaHS").innerText = st.maHS || "N/A";
    document.getElementById("txtNgaySinh").innerText = st.dob || "N/A";
    document.getElementById("txtLop").innerText = st.className || st.lop || "N/A";
    document.getElementById("txtPhuHuynh").innerText = st.parentName || "N/A";
    document.getElementById("txtDiaChi").innerText = st.address || "N/A";

    // 2. Bảng điểm
    const tblDiem = document.getElementById("tblBangDiem");
    tblDiem.innerHTML = "";
    if (data.grades && data.grades.length > 0) {
      data.grades.forEach(g => {
        tblDiem.innerHTML += `
          <tr>
            <td class="text-start ps-3 font-weight-bold">${g.subject}</td>
            <td class="fw-bold text-primary">${g.score}</td>
          </tr>`;
      });
    } else {
      tblDiem.innerHTML = `<tr><td colspan="2" class="text-muted py-3">Chưa có dữ liệu điểm số</td></tr>`;
    }

    // 3. Điểm danh đi lễ & đi học
    const tblDD = document.getElementById("tblDiemDanh");
    tblDD.innerHTML = "";
    if (data.attendance && data.attendance.length > 0) {
      data.attendance.forEach(item => {
        let badgeClass = "bg-vang"; 

        if (item.status === "Có mặt") {
          badgeClass = "bg-comat";  
        } else if (item.status === "Có phép") {
          badgeClass = "bg-cophep";
        } else if (item.status === "Đi muộn") {
          badgeClass = "bg-muon";   
        }

        tblDD.innerHTML += `
          <tr>
            <td class="fw-bold text-secondary">${item.date}</td>
            <td><span class="status-badge ${badgeClass}">${item.status}</span></td>
          </tr>`;
      });
    } else {
      tblDD.innerHTML = `<tr><td colspan="2" class="text-muted py-3">Chưa có dữ liệu điểm danh</td></tr>`;
    }

    // 4. Giáo Lý Viên
    const listGV = document.getElementById("listGiaoLyVien");
    listGV.innerHTML = "";
    if (data.teachers && data.teachers.length > 0) {
      data.teachers.forEach(gv => {
        listGV.innerHTML += `
          <li class="list-group-item px-0 d-flex justify-content-between align-items-center">
            <div>
              <span class="fw-bold">${gv.name}</span> <small class="text-muted">(${gv.role || 'GLV'})</small>
            </div>
            <a href="tel:${gv.phone}" class="btn btn-sm btn-outline-primary rounded-pill"><i class="fa-solid fa-phone me-1"></i> ${gv.phone}</a>
          </li>`;
      });
    } else {
      listGV.innerHTML = `<li class="list-group-item px-0 text-muted">Chưa có thông tin Giáo lý viên</li>`;
    }

    document.getElementById("resultContainer").classList.remove("d-none");
  }
</script>

</body>
</html>
